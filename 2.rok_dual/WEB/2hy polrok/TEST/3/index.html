<!doctype html>
<html lang="sk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Seychelles</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="page-wrap">
            <article class="travel-card">
                <img
                    class="travel-card__image"
                    src="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1600&q=80"
                    alt="Pláž na Seychelách"
                />

                <div class="travel-card__body">
                    <h1 class="travel-card__title">Seychelles</h1>

                    <p class="travel-card__author">VAŠE MENO A PRIEZVISKO</p>

                    <p class="travel-card__description">
                        Seychely vás očaria bielymi plážami, tyrkysovým oceánom
                        a exotickou prírodou. Ideálne pre relax, romantiku a
                        nezabudnuteľné dobrodružstvo. Objavte raj s našou
                        cestovnou kanceláriou!
                    </p>

                    <div class="travel-card__footer">
                        <div class="travel-card__price-wrap">
                            <p class="travel-card__price">320€</p>
                            <p class="travel-card__details">1 osoba (6 nocí)</p>
                        </div>

                        <a class="travel-card__buy-link" href="#">Kúpiť</a>
                    </div>
                </div>
            </article>
        </main>
    </body>
</html>
